# GoAccess-Konfiguration fuer das Simulator-Log
# (COMBINED + Antwortzeit in Sekunden am Zeilenende, wie vom Simulator geschrieben)

time-format %T
date-format %d/%b/%Y
log-format %h %^[%d:%t %^] "%r" %s %b "%R" "%u" %T

html-report-title Request-Simulator
html-prefs {"theme":"darkGray","perPage":10,"layout":"horizontal"}

# 444 wie 404 zaehlen, Query-Strings getrennt auswerten
444-as-404 true
double-decode true
with-mouse true
